<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Mapa dos lotes do núcleo urbano — REURB">
<title>Jacinta Ambrosina · Lotes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://jkvxudldoepbouqgfper.supabase.co" crossorigin>
<link rel="stylesheet" href="lib/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Mapa"></div>

<header class="chip titulo" id="titulo">
  <strong id="t-nome"></strong><span id="t-sub"></span>
  <span class="contagem" id="t-cont" hidden></span>
</header>

<div class="botoes" role="toolbar">
  <button class="btn" id="b-camadas" aria-label="Camadas" title="Camadas">
    <svg viewBox="0 0 24 24"><path d="M12 3 2 8.5 12 14l10-5.5L12 3Zm-8.2 9.6L2 13.6 12 19l10-5.4-1.8-1L12 17l-8.2-4.4Z"/></svg>
  </button>
  <button class="btn" id="b-nucleo" aria-label="Ver o núcleo inteiro" title="Ver o núcleo inteiro">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="btn btn-gps" id="b-gps" aria-label="Minha localização" title="Minha localização" data-estado="off">
    <svg viewBox="0 0 24 24"><path class="seta" d="M12 2 19 21l-7-4-7 4 7-19Z"/></svg>
  </button>
</div>

<div class="painel chip" id="p-camadas" hidden>
  <label><input type="checkbox" id="c-orto" checked> Ortofoto</label>
  <label><input type="checkbox" id="c-sat"> Satélite (apoio)</label>
  <label><input type="checkbox" id="c-num" checked> Números dos lotes</label>
  <label><input type="checkbox" id="c-ruas" checked> Nomes das ruas</label>
  <label><input type="checkbox" id="c-sit" checked> Situação do cadastro</label>
  <label><input type="checkbox" id="c-med" checked> Medidas do lote</label>
</div>

<div class="precisao chip" id="precisao" hidden></div>

<section class="ficha" id="ficha" hidden aria-live="polite">
  <button class="fechar" id="f-fechar" aria-label="Fechar">×</button>
  <h2 id="f-titulo"></h2>
  <div class="f-sit" id="f-sit"></div>
  <div class="f-acoes" id="f-acoes" hidden>
    <button type="button" class="b-form" id="b-form">Preencher cadastro</button>
    <button type="button" class="b-fin" id="b-fin">Confirmar cadastro</button>
  </div>
  <button type="button" class="b-limpar" id="b-limpar" hidden>Remover marcação (administrador)</button>
  <dl id="f-dados"></dl>
  <details class="f-croqui" id="f-croqui" open>
    <summary>Croqui e medidas</summary>
    <svg id="f-svg" viewBox="0 0 320 230" role="img" aria-label="Croqui do lote com as medidas dos lados"></svg>
    <ol class="f-lados" id="f-lados"></ol>
  </details>
</section>

<!-- Formulário do cadastro: os dados ficam no banco, fora da parte pública do mapa -->
<section class="form-cad" id="cad" hidden role="dialog" aria-modal="true" aria-labelledby="cad-titulo">
  <form id="cad-form" novalidate autocomplete="off">
    <header class="cad-topo">
      <button type="button" class="fechar" id="cad-fechar" aria-label="Fechar">×</button>
      <h2 id="cad-titulo">Cadastro</h2>
      <p class="cad-nota" id="cad-nota"></p>
    </header>
    <div class="cad-corpo" id="cad-corpo">
      <label class="campo" data-campo="nome"><span>Nome do responsável</span>
        <input name="nome" autocomplete="off" autocapitalize="words" maxlength="120"><em>Informe o nome completo.</em></label>
      <label class="campo" data-campo="escolaridade"><span>Escolaridade</span>
        <select name="escolaridade">
          <option value="">Selecione…</option>
          <option>Sem escolaridade</option><option>Fundamental incompleto</option><option>Fundamental completo</option>
          <option>Médio incompleto</option><option>Médio completo</option><option>Superior incompleto</option>
          <option>Superior completo</option><option>Pós-graduação</option>
        </select><em>Escolha a escolaridade.</em></label>
      <label class="campo" data-campo="profissao"><span>Profissão</span>
        <input name="profissao" maxlength="80" autocapitalize="sentences"><em>Informe a profissão (ou “Do lar”, “Desempregado”…).</em></label>
      <div class="linha">
        <label class="campo" data-campo="renda_tipo"><span>Renda · tipo</span>
          <select name="renda_tipo">
            <option value="">Selecione…</option>
            <option>Emprego formal</option><option>Trabalho informal / autônomo</option><option>Aposentadoria / pensão</option>
            <option>Benefício social</option><option>Sem renda</option><option>Outra</option>
          </select><em>Escolha o tipo de renda.</em></label>
        <label class="campo" data-campo="renda_valor"><span>Renda · valor mensal</span>
          <div class="moeda"><b>R$</b><input name="renda_valor" inputmode="decimal" placeholder="0,00"></div>
          <em>Informe o valor mensal.</em></label>
      </div>
      <label class="campo" data-campo="telefone"><span>Telefone</span>
        <input name="telefone" type="tel" inputmode="tel" placeholder="(33) 99999-9999" maxlength="16"><em>Telefone com DDD (10 ou 11 dígitos).</em></label>
      <fieldset class="grupo"><legend>Endereço</legend>
        <label class="campo" data-campo="rua"><span>Rua</span>
          <input name="rua" list="lista-ruas" maxlength="120"><em>Informe a rua.</em></label>
        <div class="linha">
          <label class="campo" data-campo="numero"><span>Número</span>
            <input name="numero" maxlength="12" placeholder="ou S/N"><em>Informe o número (ou S/N).</em></label>
          <label class="campo" data-campo="bairro"><span>Bairro</span>
            <input name="bairro" maxlength="80"><em>Informe o bairro.</em></label>
        </div>
      </fieldset>
      <div class="campo" data-campo="cadunico"><span>Tem CadÚnico?</span>
        <div class="simnao"><label><input type="radio" name="cadunico" value="sim"> Sim</label>
          <label><input type="radio" name="cadunico" value="nao"> Não</label></div><em>Responda sim ou não.</em></div>
      <div class="campo" data-campo="bolsa_familia"><span>Recebe Bolsa Família?</span>
        <div class="simnao"><label><input type="radio" name="bolsa_familia" value="sim"> Sim</label>
          <label><input type="radio" name="bolsa_familia" value="nao"> Não</label></div><em>Responda sim ou não.</em></div>
    </div>
    <footer class="cad-rodape">
      <small id="cad-msg"></small>
      <button type="button" class="sec" id="cad-editar" hidden>Editar (administrador)</button>
      <button type="submit" id="cad-salvar">Salvar cadastro</button>
    </footer>
  </form>
  <datalist id="lista-ruas"></datalist>
</section>

<!-- Pede o PIN da equipe ou o código de administrador -->
<div class="dlg-fundo" id="dlg" hidden>
  <form class="dlg" id="dlg-form" autocomplete="off">
    <label for="dlg-in" id="dlg-titulo">PIN da equipe</label>
    <input id="dlg-in" type="password" inputmode="numeric" autocomplete="off">
    <small id="dlg-msg"></small>
    <div><button type="button" class="sec" id="dlg-cancelar">Cancelar</button><button type="submit">Confirmar</button></div>
  </form>
</div>

<div class="aviso" id="aviso" hidden></div>

<script src="config.js"></script>
<script src="lib/pmtiles.js"></script>
<script src="lib/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
